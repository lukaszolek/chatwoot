default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch('POSTGRES_HOST', 'localhost') %>
  port: <%= ENV.fetch('POSTGRES_PORT', '5432') %>
   # ref: https://github.com/mperham/sidekiq/issues/2985#issuecomment-531097962
  pool: <%= Sidekiq.server? ? ENV.fetch('SIDEKIQ_CONCURRENCY', 10) : ENV.fetch('RAILS_MAX_THREADS', 5) %>
  # frequency in seconds to periodically run the Reaper, which attempts
  # to find and recover connections from dead threads
  reaping_frequency: <%= ENV.fetch('DB_POOL_REAPING_FREQUENCY', 30) %>
  variables:
    # we are setting this value to be close to the racktimeout value. we will iterate and reduce this value going forward
    statement_timeout: <%= ENV["POSTGRES_STATEMENT_TIMEOUT"] || "14s" %>

# `photographer_directory` is the read + write-limited-scope secondary
# connection used by the outreach engine. Rows live in a separate service
# (photographer-directory). Access is gated by a dedicated DB role with
# SELECT on photographer_photographers + photographer_campaign_status and
# UPDATE only on consent columns (marketing_consent,
# unsubscribed_from_all_campaigns, unsubscribed_from_all_at,
# gdpr_delete_requested_at). `database_tasks: false` keeps Rails from
# migrating/seeding the secondary — its schema is owned elsewhere.
pd_default: &pd_default
  adapter: postgresql
  encoding: unicode
  pool: <%= Sidekiq.server? ? ENV.fetch('SIDEKIQ_CONCURRENCY', 10) : ENV.fetch('RAILS_MAX_THREADS', 5) %>
  reaping_frequency: <%= ENV.fetch('DB_POOL_REAPING_FREQUENCY', 30) %>
  database_tasks: false
  url: <%= ENV.fetch('PHOTOGRAPHER_DIRECTORY_DATABASE_URL', nil) %>

development:
  primary:
    <<: *default
    database: "<%= ENV.fetch('POSTGRES_DATABASE', 'chatwoot_dev') %>"
    username: "<%= ENV.fetch('POSTGRES_USERNAME', 'postgres') %>"
    password: "<%= ENV.fetch('POSTGRES_PASSWORD', '') %>"
  photographer_directory:
    <<: *pd_default

test:
  primary:
    <<: *default
    database: "<%= ENV.fetch('POSTGRES_DATABASE', 'chatwoot_test') %>"
    username: "<%= ENV.fetch('POSTGRES_USERNAME', 'postgres') %>"
    password: "<%= ENV.fetch('POSTGRES_PASSWORD', '') %>"
  photographer_directory:
    <<: *pd_default
    # In CI/FOSS the dedicated secondary is not provisioned. ActiveRecord still
    # enlists every configured connection for transactional fixtures, so a nil
    # url makes the whole suite fail trying to reach a local socket. Fall back
    # to the primary test database (no spec queries the secondary tables —
    # they all stub/skip), which keeps the connection enlistable.
    url: <%= ENV['PHOTOGRAPHER_DIRECTORY_TEST_DATABASE_URL'].to_s.strip.empty? ? "postgresql://#{ENV.fetch('POSTGRES_USERNAME', 'postgres')}:#{ENV.fetch('POSTGRES_PASSWORD', '')}@#{ENV.fetch('POSTGRES_HOST', 'localhost')}:#{ENV.fetch('POSTGRES_PORT', '5432')}/#{ENV.fetch('POSTGRES_DATABASE', 'chatwoot_test')}" : ENV['PHOTOGRAPHER_DIRECTORY_TEST_DATABASE_URL'] %>

production:
  primary:
    <<: *default
    database: "<%= ENV.fetch('POSTGRES_DATABASE', 'chatwoot_production') %>"
    username: "<%= ENV.fetch('POSTGRES_USERNAME', 'chatwoot_prod') %>"
    password: "<%= ENV.fetch('POSTGRES_PASSWORD', 'chatwoot_prod') %>"
  photographer_directory:
    <<: *pd_default
