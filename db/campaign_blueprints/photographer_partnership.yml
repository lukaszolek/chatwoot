# Photographer Partnership outbound campaign blueprint.
# Declarative definition of pipeline stages + templates. Applied via
#   bundle exec rake "outreach:blueprints:apply[<account_id>]"
# The applier is idempotent: re-running leaves unchanged rows untouched,
# updates edited bodies, and soft-deactivates templates removed from YAML.
#
# Stages follow the source plan §6.4. Reply router branches are keyed by
# LLM intent class; min_confidence gates the auto-path vs escalation.
#
# Template copy principles (applied 2026-04-22, incorporating
# `marketing-psychology` skill + formality rules from
# photographer-directory/apps/crawler/src/services/email-personalization.service.ts):
#
#   - Authority/similarity: named founder (not "the team"), short
#   - Specificity: concrete product details (MDF, pigment print, matte, no glass)
#   - Reciprocity framing: a personal discount as a welcome gesture, not
#     a transactional bait
#   - Low-commitment CTA: "one-word reply is enough" — no forced signup
#   - No percentages in outbound copy (those live in the partner panel
#     post-signup; keeps competitive info private)
#   - Social proof avoided until we have honest numbers; swapped for
#     product-confidence via concrete production details
#   - Clean signature block: "Pozdrawiam," then blank line, then name
#     and "z Framky" / "at Framky" / "von Framky" on separate lines
#
# Formality per language (source: email-personalization.service.ts:166):
#   - very-formal: de, fr   → Sie/Vous, "Mit freundlichen Grüßen"
#   - moderate:    pl, it, en, cs, ro → first-name + Ty / polite you
#   - relaxed:     da, nl, es, fi → casual
#
# Add translations for additional locales in the same order.

program_key: photographer_partnership
name: Photographer Partnership
default_locale: en

stages:
  - key: intro
    on_enter_action: send_template
    template_slot: intro
    position: 1
    next_stage_key: reminder_wait

  - key: reminder_wait
    on_enter_action: wait
    auto_advance_after_hours: 168   # 7 days — personal-outreach cadence
    position: 2
    next_stage_key: reminder_send

  - key: reminder_send
    on_enter_action: send_template
    template_slot: reminder
    position: 3
    next_stage_key: breakup_wait

  - key: breakup_wait
    on_enter_action: wait
    auto_advance_after_hours: 168   # 7 days — personal-outreach cadence
    position: 4
    next_stage_key: breakup_send

  - key: breakup_send
    on_enter_action: send_template
    template_slot: breakup
    position: 5
    next_stage_key: terminal

  - key: reply_router
    on_enter_action: classify_reply
    position: 6
    branch_rules:
      interested_signup: { target: escalated, min_confidence: 0.85 }
      interested_commission: { target: auto_reply_commission, min_confidence: 0.90 }
      asks_showroom: { target: escalated, min_confidence: 0.0 }
      asks_product: { target: auto_reply_product, min_confidence: 0.85 }
      declined: { target: terminal, min_confidence: 0.85 }
      out_of_office: { target: reminder_wait, min_confidence: 0.70 }
      spam: { target: terminal, min_confidence: 0.80 }
      unclear: { target: escalated, min_confidence: 0.0 }

  - key: auto_reply_commission
    on_enter_action: send_template
    template_slot: reply_interested_commission
    position: 7
    next_stage_key: terminal

  - key: auto_reply_product
    on_enter_action: send_template
    template_slot: reply_asks_product
    position: 8
    next_stage_key: terminal

  - key: escalated
    on_enter_action: escalate_to_user
    position: 9

  - key: terminal
    on_enter_action: terminal
    position: 10

templates:
  # ==========================================================================
  # INTRO — first touch, moderate-warm, product-credible, low-commitment CTA
  # ==========================================================================

  - slot: intro
    locale: pl   # moderate formality — Ty, Cześć
    subject: "{{first_name}}, Twoi klienci + ramki na ścianie — szybka propozycja"
    body: |
      Cześć {{first_name}},

      {{personal_opener}}

      Jestem Łukasz, założyłem Framky. Tworzymy wysokiej jakości
      galerie zdjęć na ścianę — fine-art drukowany na 12-tuszowej
      maszynie pigmentowej, na matowym papierze bez szkła. Całość
      wiesza się w kilka minut dzięki szablonowi montażowemu
      i samoprzylepnym wieszakom.

      Większość Twoich sesji kończy życie w folderze na komputerze
      klienta. Framky to najkrótsza droga z dysku twardego na
      ścianę — bez ramiarza, bez żmudnego mierzenia, bez wiercenia.

      Co z tego masz:

      • Twój kod = **25% rabatu** dla Twojego klienta
      • **20% prowizji** od każdego zamówienia — zero pracy po Twojej
        stronie, zero obsługi, zero rozliczeń z klientem
      • Osobny kod **-40%** tylko dla Ciebie — na własne galerie,
        prezenty, showroom w Twoim studio

      Jeśli brzmi interesująco, wystarczy jedno zdanie w odpowiedzi —
      opowiem więcej albo podeślę link do rejestracji.

      Pozdrawiam,

      Łukasz
      z Framky
    llm_guidance: |
      Polski — rejestr moderate, Ty (nie Pan). Personalizuj TYLKO
      placeholder {{personal_opener}} konkretnym detalem z website
      snippet (styl, specjalizacja, klimat zdjęć) — 1–2 zdania, bez
      superlatyw w stylu "uwielbiam Twoje zdjęcia". Resztę treści
      i liczby zostaw DOKŁADNIE tak jak w szablonie. Imię dobieraj
      z owner_name.

  - slot: intro
    locale: en   # moderate — first name, warm-professional
    subject: "{{first_name}}, your clients + a wall — a quick idea"
    body: |
      Hi {{first_name}},

      {{personal_opener}}

      I'm Łukasz, founder of Framky. We make high-quality gallery
      walls — fine-art prints on a 12-ink pigment printer, matte
      photo paper, no glass. The whole thing goes up in minutes
      thanks to a hanging template and self-adhesive hooks.

      Most of your sessions end up living in a folder on the client's
      computer. Framky is the shortest path from hard drive to wall —
      no framer, no tedious measuring, no drilling.

      What's in it for you:

      • Your code = **25% off** for your client
      • **20% commission** on every order — zero extra work on your
        side, zero customer support, zero billing with the client
      • A separate code **-40%** just for you — for your own galleries,
        gifts, a showroom in your studio

      If it sounds interesting, a one-line reply is enough — I'll send
      more detail or a direct signup link.

      Best,

      Łukasz
      at Framky
    llm_guidance: |
      English — moderate, first-name basis. Personalize ONLY the
      {{personal_opener}} placeholder with 1–2 concrete sentences
      grounded in the website snippet (style, niche, mood). Keep the
      rest of the template — numbers, bullets, signature — EXACTLY
      as written. No "I love your work" clichés.

  - slot: intro
    locale: de   # very-formal — Sie, "Mit freundlichen Grüßen", Łukasz Olek
    subject: "{{first_name}}, Ihre Kundinnen und Kunden + eine Wand — kurzer Vorschlag"
    body: |
      Guten Tag {{first_name}},

      {{personal_opener}}

      Mein Name ist Łukasz Olek, ich habe Framky gegründet. Wir
      fertigen hochwertige Wandgalerien — Fine-Art-Druck auf einem
      12-Tinten-Pigmentdrucker, auf mattem Fotopapier, ohne Glas.
      Das Ganze ist in wenigen Minuten an der Wand — dank
      Hängeschablone und selbstklebenden Aufhängern.

      Die meisten Ihrer Sessions enden in einem Ordner auf dem
      Rechner der Kundschaft. Framky ist der kürzeste Weg von der
      Festplatte zur Wand — ohne Rahmer, ohne mühsames Ausmessen,
      ohne Bohren.

      Was Sie davon haben:

      • Ihr Code = **25% Rabatt** für Ihre Kund:innen
      • **20% Provision** auf jede Bestellung — null zusätzlicher
        Aufwand auf Ihrer Seite, kein Kundensupport, keine Abrechnung
      • Ein eigener Code **-40%** nur für Sie — für eigene Galerien,
        Geschenke, einen Showroom in Ihrem Studio

      Falls es Sie anspricht, reicht eine kurze Antwort — ich schicke
      Details oder direkt den Registrierungs-Link.

      Mit freundlichen Grüßen,

      Łukasz Olek
      von Framky
    llm_guidance: |
      Deutsch — very-formal, Sie/Ihre. "Guten Tag" statt "Hallo" für
      den Erstkontakt. Personalisieren Sie AUSSCHLIESSLICH den
      Platzhalter {{personal_opener}} mit 1–2 konkreten Sätzen aus
      dem Website-Snippet (Stil, Nische, Bildsprache). Der Rest des
      Templates — Zahlen, Bullets, Signatur — bleibt UNVERÄNDERT.
      Signatur: "Łukasz Olek, von Framky" (voller Name in formalen
      Märkten).

  # ==========================================================================
  # REMINDER — 7 days later, gentler, one-word-reply CTA
  # ==========================================================================

  - slot: reminder
    locale: pl
    subject: "Re: {{first_name}}, Twoi klienci + ramki na ścianie"
    body: |
      Cześć {{first_name}},

      Wracam jeszcze raz — poprzedni mail mógł wpaść w spam albo do
      kolejki "do przeczytania kiedyś".

      Jeśli krótko: klienci dostają rabat z Twoim kodem, Ty prowizję
      od każdego ich zamówienia, plus osobny kod na Twoje własne
      galerie. Bez presji i bez zobowiązań.

      Jedno słowo w odpowiedzi — "tak", "nie teraz", "odpisz później" —
      wystarczy.

      Pozdrawiam,

      Łukasz
      z Framky

  - slot: reminder
    locale: en
    subject: "Re: {{first_name}}, your clients + a wall"
    body: |
      Hi {{first_name}},

      Following up — my previous note may have landed in spam, or just
      in the "read later" pile.

      The short version: your clients get a discount with your code,
      you get a commission on their orders, plus a personal code for
      your own galleries. No pressure, no commitment.

      A one-word reply — "yes", "not now", "ping me later" — is enough.

      Best,

      Łukasz
      at Framky

  - slot: reminder
    locale: de
    subject: "Re: {{first_name}}, Ihre Kund:innen + eine Wand"
    body: |
      Guten Tag {{first_name}},

      kurzes Follow-up — meine letzte Nachricht ist vielleicht im Spam
      gelandet oder im "lese ich später"-Stapel.

      Ganz kurz: Ihre Kund:innen bekommen einen Rabatt mit Ihrem Code,
      Sie die Provision auf deren Bestellungen, plus einen persönlichen
      Code für Ihre eigenen Galerien. Kein Druck, keine Verpflichtung.

      Ein Wort als Antwort — "ja", "nicht jetzt", "später nochmal
      anschreiben" — reicht.

      Mit freundlichen Grüßen,

      Łukasz
      von Framky

  # ==========================================================================
  # BREAKUP — 14 days, graceful exit, door left open with a concrete hook
  # ==========================================================================

  - slot: breakup
    locale: pl
    subject: "Ostatni mail w tej sprawie, {{first_name}}"
    body: |
      Cześć {{first_name}},

      OK — nie będę się już dopytywał, to ostatni mail w tej sprawie.

      Gdyby kiedyś klient zapytał "gdzie wydrukować sesję na ścianę"
      i pomyślisz o Framky — odpisz na tego maila, kod partnerski
      ustawimy w 5 minut.

      Tym razem — wszystkiego dobrego w pracy.

      Łukasz
      z Framky

  - slot: breakup
    locale: en
    subject: "Last note on this, {{first_name}}"
    body: |
      Hi {{first_name}},

      OK — I'll stop following up, this is the last one from me.

      If a client ever asks "where do I actually print this on a wall?"
      and Framky comes to mind — reply to this email, we'll set your
      partner code up in five minutes.

      Best of luck with the work in the meantime.

      Łukasz
      at Framky

  - slot: breakup
    locale: de
    subject: "Letzte Nachricht dazu, {{first_name}}"
    body: |
      Guten Tag {{first_name}},

      das war's — ich lasse es dabei bewenden.

      Falls Ihre Kund:innen jemals fragen "wo drucken wir die Serie
      eigentlich für die Wand?" und Framky Ihnen einfällt — antworten
      Sie einfach auf diese Mail, den Partner-Code richten wir in
      fünf Minuten ein.

      Alles Gute bis dahin.

      Łukasz
      von Framky

  # ==========================================================================
  # REPLY AUTO-ANSWERS — only fire when classifier ≥ 0.85/0.90 confidence
  # ==========================================================================

  - slot: reply_interested_commission
    locale: pl
    subject: "Re: Framky — jak liczymy prowizję"
    body: |
      Cześć {{first_name}},

      Krótko: prowizja liczona jest od każdego zamówienia złożonego
      Twoim kodem, po rabacie dla klienta. Wypłata raz w miesiącu,
      gdy saldo przekroczy minimalną kwotę.

      Konkretne procenty widzisz w Panelu Partnera po rejestracji:
      framky.com/pl-pl/program-partnerski/rejestracja

      Jeśli coś jeszcze niejasne, po prostu odpisz.

      Pozdrawiam,

      Łukasz
      z Framky
    llm_guidance: |
      Polski moderate. Pod 120 słów. Bez konkretnych procentów —
      kieruj do Panelu Partnera. Jeśli pytanie było konkretne,
      odpowiedz na nie wprost; inaczej trzymaj się domyślnej treści.

  - slot: reply_interested_commission
    locale: en
    subject: "Re: Framky — how the commission works"
    body: |
      Hi {{first_name}},

      Short version: commission is calculated on every order placed
      with your code, after the client discount. Paid monthly once
      your balance crosses the minimum.

      Exact percentages live in the Partner Panel once you register:
      framky.com/partnerships/register

      Anything still unclear — just reply.

      Best,

      Łukasz
      at Framky
    llm_guidance: |
      English moderate. Under 120 words. No specific percentages —
      point to the Partner Panel.

  - slot: reply_interested_commission
    locale: de
    subject: "Re: Framky — wie die Provision funktioniert"
    body: |
      Guten Tag {{first_name}},

      Kurz: Die Provision wird auf jede Bestellung mit Ihrem Code
      berechnet, nach Abzug des Kundenrabatts. Auszahlung monatlich,
      sobald das Guthaben die Mindestsumme erreicht.

      Die genauen Prozentsätze sehen Sie im Partner-Panel nach der
      Registrierung: framky.com/de-de/partnerprogramm/anmelden

      Wenn noch etwas unklar ist, antworten Sie einfach.

      Mit freundlichen Grüßen,

      Łukasz
      von Framky
    llm_guidance: |
      Deutsch very-formal, Sie. Unter 120 Wörtern. Keine konkreten
      Prozentsätze — auf das Partner-Panel verweisen.

  - slot: reply_asks_product
    locale: pl
    subject: "Re: Framky — jak to wygląda w zamówieniu"
    body: |
      Cześć {{first_name}},

      Galerie Framky to zestawy zdjęć w ramkach MDF z drukiem
      pigmentowym na matowym papierze fotograficznym. Bez szkła —
      więc żadnych odbłysków, i są lekkie. W zestawie wieszaki
      samoprzylepne; opcjonalnie montaż na dwa gwoździe.

      Więcej: framky.com/pl-pl/galerie-zdjec-w-ramkach

      Pozdrawiam,

      Łukasz
      z Framky
    llm_guidance: |
      Używaj dokładnej terminologii produktu Framky (MDF, pigment,
      matowy papier). Poniżej 140 słów.

  - slot: reply_asks_product
    locale: en
    subject: "Re: Framky — how the product looks in an order"
    body: |
      Hi {{first_name}},

      Framky galleries are curated sets of framed photos: MDF frames,
      pigment print on matte photo paper, no glass — so no reflections,
      and they're light. Self-adhesive hangers come in the box; a
      two-nail mount is optional.

      More: framky.com/photo-gallery-walls

      Best,

      Łukasz
      at Framky
    llm_guidance: |
      Mirror Framky product terminology exactly (MDF, pigment print,
      matte). Under 140 words.

  - slot: reply_asks_product
    locale: de
    subject: "Re: Framky — wie das Produkt in der Bestellung aussieht"
    body: |
      Guten Tag {{first_name}},

      Framky-Galerien sind kuratierte Sets gerahmter Fotos: MDF-Rahmen,
      Pigmentdruck auf mattem Fotopapier, ohne Glas — keine
      Reflexionen, angenehm leicht. Selbstklebende Aufhänger liegen
      bei; eine Zwei-Nagel-Montage ist optional.

      Mehr dazu: framky.com/de-de/fotogalerie-an-der-wand

      Mit freundlichen Grüßen,

      Łukasz
      von Framky
    llm_guidance: |
      Framky-Produktterminologie exakt übernehmen (MDF-Rahmen,
      Pigmentdruck, mattes Fotopapier). Unter 140 Wörtern.
